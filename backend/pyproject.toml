[project]
name = "beautify-slides-backend"
version = "0.1.0"
description = "Structural PowerPoint retrieval demo API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0.2,<2",
  "sqlalchemy[asyncio]>=2.0.37,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.3.6,<1",
  "sentence-transformers>=3.3,<6",
  "langchain>=1.0,<2",
  "langchain-groq>=0.3,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
beautify-slides = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]
